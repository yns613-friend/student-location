<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>내 위치 전송</title>

  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Black+Han+Sans&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg         : #0d1117;
      --surface    : #161b22;
      --border     : #30363d;
      --accent     : #3fb950;
      --accent-glow: rgba(63,185,80,.35);
      --warn       : #f85149;
      --text-main  : #e6edf3;
      --text-muted : #8b949e;
      --radius     : 16px;
    }

    html, body {
      height: 100%;
      font-family: 'Gowun Dodum', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(63,185,80,.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(56,139,253,.08) 0%, transparent 50%);
      pointer-events: none;
    }

    .wrapper {
      position: relative; z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
      gap: 22px;
    }

    .title-block { text-align: center; }

    .title-block .icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 8px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    .title-block h1 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      letter-spacing: -.5px;
    }

    .title-block p {
      margin-top: 6px;
      font-size: .9rem;
      color: var(--text-muted);
    }

    /* 이름 입력 카드 */
    .card {
      width: 100%; max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
    }

    .card label { font-size: .85rem; color: var(--text-muted); letter-spacing: .5px; }

    .card input {
      width: 100%; padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 1rem; outline: none;
      transition: border-color .2s;
    }

    .card input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .card input::placeholder { color: var(--text-muted); }

    /* 추적 시작 버튼 */
    .send-btn {
      width: 100%; max-width: 400px;
      padding: 18px;
      border: none; border-radius: var(--radius);
      font-family: 'Black Han Sans', sans-serif;
      font-size: 1.2rem; letter-spacing: 1px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      background: var(--accent);
      color: #0d1117;
      box-shadow: 0 4px 24px var(--accent-glow);
    }

    /* 추적 시작 후 버튼 숨김 */
    .send-btn.hidden { display: none; }

    /* 추적 중 상태 표시 배너 */
    .tracking-banner {
      width: 100%; max-width: 400px;
      padding: 16px 20px;
      background: rgba(63,185,80,.1);
      border: 1px solid rgba(63,185,80,.35);
      border-radius: var(--radius);
      text-align: center;
      font-size: .95rem;
      color: var(--accent);
      display: none;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .tracking-banner.visible { display: block; }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 rgba(63,185,80,0); }
      50%       { box-shadow: 0 0 18px rgba(63,185,80,.25); }
    }

    .send-btn:hover { transform: translateY(-2px); }
    .send-btn:active { transform: translateY(0); }

    /* 카운트다운 바 */
    .progress-wrap {
      width: 100%; max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: none; /* 추적 시작 전 숨김 */
      flex-direction: column;
      gap: 10px;
    }

    .progress-wrap.visible { display: flex; }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .82rem;
      color: var(--text-muted);
    }

    .progress-info .next-label { color: var(--accent); font-weight: 600; }

    .progress-bar-bg {
      width: 100%; height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      width: 100%;
      transition: width 1s linear;
    }

    /* 좌표 미리보기 */
    .coords-preview {
      font-size: .78rem;
      color: var(--text-muted);
      text-align: center;
    }

    .coords-preview span { color: var(--accent); }

    /* 상태 메시지 */
    .status {
      width: 100%; max-width: 400px;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: .88rem;
      text-align: center;
      border: 1px solid transparent;
      opacity: 0; transform: translateY(8px);
      transition: opacity .3s, transform .3s;
      pointer-events: none;
    }

    .status.visible { opacity: 1; transform: translateY(0); }

    .status.success {
      background: rgba(63,185,80,.1);
      border-color: rgba(63,185,80,.4);
      color: var(--accent);
    }

    .status.error {
      background: rgba(248,81,73,.1);
      border-color: rgba(248,81,73,.4);
      color: var(--warn);
    }

    @media (max-width: 480px) {
      .send-btn { font-size: 1.05rem; padding: 16px; }
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- 타이틀 -->
  <div class="title-block">
    <span class="icon" id="titleIcon">📍</span>
    <h1>현재 위치 전송</h1>
    <p id="titleDesc">버튼을 눌러 자동 위치 추적을 시작하세요</p>
  </div>

  <!-- 이름 입력 카드 -->
  <div class="card">
    <label for="studentName">이름 또는 학번</label>
    <input
      type="text"
      id="studentName"
      placeholder="예) 홍길동 또는 20241001"
      maxlength="30"
      autocomplete="off"
    />
  </div>

  <!-- 추적 시작 버튼 (추적 시작 후 숨겨짐) -->
  <button class="send-btn" id="startBtn" onclick="startTracking()">
    🟢 위치 추적 시작
  </button>

  <!-- 추적 중 상태 배너 (추적 시작 후 표시) -->
  <div class="tracking-banner" id="trackingBanner">
    🛰️ 위치 추적 중&nbsp;&nbsp;—&nbsp;&nbsp;자동으로 전송되고 있습니다
  </div>

  <!-- 카운트다운 진행 바 (추적 중에만 표시) -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-info">
      <span>다음 전송까지</span>
      <span class="next-label" id="nextLabel">60초</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="progress-info">
      <span id="sendCount">총 0회 전송됨</span>
      <span id="lastSentTime"></span>
    </div>
  </div>

  <!-- 좌표 미리보기 -->
  <div class="coords-preview" id="coordsPreview"></div>

  <!-- 상태 메시지 -->
  <div class="status" id="statusMsg"></div>

</div>

<script>
  // ============================================================
  // ⚙️ 설정값
  // ============================================================
  var APPS_SCRIPT_URL   = 'YOUR_APPS_SCRIPT_WEBAPP_URL_HERE'; // Apps Script 웹앱 URL
  var SEND_INTERVAL_SEC = 60; // 자동 전송 간격 (초) — 원하는 값으로 변경

  // ============================================================
  // 전역 상태 변수
  // ============================================================
  var isTracking  = false;  // 추적 중 여부
  var sendCount   = 0;      // 총 전송 횟수
  var intervalID  = null;   // setInterval ID
  var countdownID = null;   // 카운트다운 setInterval ID
  var remaining   = SEND_INTERVAL_SEC; // 다음 전송까지 남은 초

  // ============================================================
  // ▶️ startTracking() - 자동 추적 시작 (한 번 시작하면 중지 불가)
  // ============================================================
  function startTracking() {
    var nameInput = document.getElementById('studentName').value.trim();

    if (!nameInput) {
      showStatus('이름 또는 학번을 입력해주세요.', 'error');
      document.getElementById('studentName').focus();
      return;
    }

    if (!navigator.geolocation) {
      showStatus('이 브라우저는 위치 서비스를 지원하지 않습니다.', 'error');
      return;
    }

    isTracking = true;

    // 이름 입력 잠금 (추적 중 변경 방지)
    document.getElementById('studentName').disabled = true;

    // 시작 버튼 숨기고 추적 중 배너 표시
    document.getElementById('startBtn').classList.add('hidden');
    document.getElementById('trackingBanner').classList.add('visible');

    // 타이틀 변경
    document.getElementById('titleIcon').textContent = '🛰️';
    document.getElementById('titleDesc').textContent = '위치를 자동으로 전송하고 있습니다';

    // 카운트다운 바 표시
    document.getElementById('progressWrap').classList.add('visible');

    // 즉시 1회 전송
    sendOnce();

    // 이후 일정 간격마다 반복 전송
    intervalID = setInterval(function() {
      sendOnce();
    }, SEND_INTERVAL_SEC * 1000);

    // 카운트다운 시작
    startCountdown();
  }

  // ============================================================
  // 📡 sendOnce() - GPS 수집 후 1회 전송
  // ============================================================
  function sendOnce() {
    var name = document.getElementById('studentName').value.trim();

    showStatus('📡 위치 정보를 가져오는 중...', 'success');

    navigator.geolocation.getCurrentPosition(
      function(position) {
        var lat = position.coords.latitude;
        var lng = position.coords.longitude;

        // 좌표 미리보기 갱신
        document.getElementById('coordsPreview').innerHTML =
          '위도 <span>' + lat.toFixed(6) + '</span> &nbsp;|&nbsp; 경도 <span>' + lng.toFixed(6) + '</span>';

        // 서버 전송
        postToServer({ name: name, latitude: lat, longitude: lng });
      },
      function(err) {
        var messages = {
          1: '위치 권한이 거부되었습니다. 추적을 중지합니다.',
          2: '위치 정보를 가져올 수 없습니다.',
          3: '위치 요청 시간이 초과되었습니다.'
        };
        showStatus('⚠️ ' + (messages[err.code] || '오류 발생'), 'error');
        // 권한 거부 시 상태 메시지만 표시 (중지 기능 없음)
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  // ============================================================
  // 📤 postToServer() - Apps Script로 좌표 전송
  // ============================================================
  function postToServer(data) {
    fetch(APPS_SCRIPT_URL, {
      method : 'POST',
      mode   : 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body   : JSON.stringify(data)
    })
    .then(function() {
      sendCount++;
      var now = new Date();
      var timeStr = now.getHours() + ':' +
                    String(now.getMinutes()).padStart(2, '0') + ':' +
                    String(now.getSeconds()).padStart(2, '0');

      // 전송 횟수 및 마지막 전송 시각 업데이트
      document.getElementById('sendCount').textContent = '총 ' + sendCount + '회 전송됨';
      document.getElementById('lastSentTime').textContent = '마지막: ' + timeStr;

      showStatus('✅ 위치 전송 완료 (' + timeStr + ')', 'success');

      // 카운트다운 리셋
      resetCountdown();
    })
    .catch(function(err) {
      showStatus('❌ 전송 실패: ' + err.message, 'error');
    });
  }

  // ============================================================
  // ⏱️ 카운트다운 바 관련 함수
  // ============================================================
  function startCountdown() {
    remaining = SEND_INTERVAL_SEC;
    updateCountdownUI();

    countdownID = setInterval(function() {
      remaining--;
      if (remaining < 0) remaining = 0;
      updateCountdownUI();
    }, 1000);
  }

  function resetCountdown() {
    clearInterval(countdownID);
    startCountdown();
  }

  function updateCountdownUI() {
    document.getElementById('nextLabel').textContent = remaining + '초';
    var pct = (remaining / SEND_INTERVAL_SEC) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
  }

  // ============================================================
  // 🎨 UI 헬퍼
  // ============================================================
  function showStatus(msg, type) {
    var el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status ' + type + ' visible';
  }

  // 엔터키로 시작 가능
  document.getElementById('studentName').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') startTracking();
  });
</script>

</body>
</html>
